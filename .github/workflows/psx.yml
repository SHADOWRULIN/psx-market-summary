name: PSX Downloader

on:
  schedule:

    # Every 5 minutes
    # Between 2 PM and 3:55 PM PKT

    - cron: "*/5 9-10 * * 1-5"

  workflow_dispatch:

jobs:
  run:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -r requirements.txt

      - name: Run
        run: |
          python downloader.py

      - name: Commit Files
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com

          git add .
          git commit -m "PSX update" || echo "No Changes"

          git push