name: PSX Downloader

permissions:
  contents: write

on:
  schedule:
    # - cron: "25-59/5 10 * * 1-5"
    - cron: "*/5 * * * *"
    - cron: "0 11 * * 1-5"

  workflow_dispatch:

jobs:
  run:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -r requirements.txt

      - name: Run
        run: |
          python downloader.py

      - name: Commit Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add .

          if ! git diff --staged --quiet; then
            git commit -m "PSX update"
            git push
          else
            echo "No changes"
          fi