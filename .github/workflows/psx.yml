name: PSX Downloader

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    # 10:25, 10:35, 10:45, 10:55 UTC (3:25 PM - 3:55 PM PKT) on Sun-Fri
    # - cron: "25,35,45,55 10 * * 0-5"
    # 11:00 UTC (4:00 PM PKT) on Sun-Fri
    # - cron: "0 11 * * 0-5"
    # 12:35 UTC (5:35 PM PKT) today
    - cron: "35 12 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -r requirements.txt

      - name: Run
        run: |
          python downloader.py

      - name: Commit Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add .

          if ! git diff --staged --quiet; then
            git commit -m "PSX update"
            git push
          else
            echo "No changes"
          fi